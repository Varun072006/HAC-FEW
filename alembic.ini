[alembic]
script_location = migrations
# The database URL comes from PLATFORM_DATABASE_URL (or `alembic -x url=...`), never from this file.

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
